baseURL = "https://noctis-sikong.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "一切都是命运石之门的选择！"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
summaryLength = 70

[params]
  brand = "Noctis 手记"
  author = "天才变态少女"
  description = "算法、数据结构、深度学习与图像分割的学习笔记。"
  avatar = "/克里斯.jpg"
  github = "Noctis-SiKong"
  email = "hui703101@163.com"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[frontmatter]
  date = ["date"]
  publishDate = ["publishDate", "date"]
  lastmod = ["lastmod", "date"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10

[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 1
  endLevel = 3
[markup.goldmark.extensions.passthrough]
  enable = true
[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$'], ['\[', '\]']]
  inline = [['\(', '\)'], ['$', '$']]
